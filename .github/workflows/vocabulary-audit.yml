name: Vocabulary Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run vocabulary regression tests
        run: ./gradlew testDebugUnitTest --tests 'de.bascurt.almancaokuyucu.data.LessonVocabularyAuditTest'
