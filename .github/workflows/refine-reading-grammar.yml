name: Refine Reading And Grammar
on:
  push:
    paths:
      - .github/workflows/refine-reading-grammar.yml
      - .github/scripts/refine_reading_grammar.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/refine_reading_grammar.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt app/src/main/java/de/bascurt/almancaokuyucu/data/ContextLessonEnhancer.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine reader links compact header and grammar tab"
          git push
