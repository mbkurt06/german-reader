name: Fix MainActivity Trim Compile Error
on:
  push:
    paths:
      - .github/workflows/fix-mainactivity-trim.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid character literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt')
          s = p.read_text()
          old = ".trim('.,')"
          new = ".trim('.', ',')"
          if old not in s:
              raise SystemExit("Expected invalid trim('.,') expression not found")
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt
          git commit -m "Fix invalid trim character literal"
          git push
