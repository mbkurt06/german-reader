name: Fix Sentence Scoped Highlights
on:
  push:
    paths:
      - '.github/workflows/fix-sentence-scoped-highlights.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refine first story links
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Always apply weak/context links first and strong grammatical groups last.
          # This guarantees that later weak links such as "mit ihrer Chefin" or
          # "über den ersten Arbeitstag" cannot interfere with the strong
          # "spricht ... mit ... über" relation.
          p = Path('app/src/main/java/de/bascurt/almancaokuyucu/data/ContextLessonEnhancer.kt')
          s = p.read_text()
          old = '        phrases.sortedByDescending { it.words.size }.forEach { phrase ->'
          new = '        phrases.sortedWith(compareBy<ContextPhrase> { it.strongLink }.thenByDescending { it.words.size }).forEach { phrase ->'
          if old not in s:
              raise SystemExit('ContextLessonEnhancer ordering anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Add a sentence-scoped weak/context group for "ihre neue Arbeit".
          # The tapped word stays dark; the other members are shown with the
          # lighter linked highlight.
          p = Path('app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt')
          s = p.read_text()
          anchor = '            phrases = listOf(\n                link("im Hotel", "otelde", "im Hotel → otelde. im = in + dem; bir yerin içinde bulunmayı anlatır."),\n'
          replacement = '            phrases = listOf(\n                linkAt(0, "ihre neue Arbeit", "yeni işi", "ihre neue Arbeit → onun yeni işi. Bu isim grubunda ihre iyelik bildirir, neue sıfattır ve Arbeit isimdir; seçilen kelime koyu, aynı isim grubundaki diğer kelimeler bağlantılı olarak açık vurgulanır."),\n                link("im Hotel", "otelde", "im Hotel → otelde. im = in + dem; bir yerin içinde bulunmayı anlatır."),\n'
          if anchor not in s:
              raise SystemExit('FocusedLessons first-story anchor not found')
          s = s.replace(anchor, replacement, 1)

          # 3) Add sentence-scoped weak-link helper if it does not exist yet.
          helper_anchor = '    private fun strongAt(sentenceIndex: Int, text: String, meaning: String, explanation: String) = ContextPhrase('
          if 'private fun linkAt(' not in s:
              helper = '''    private fun linkAt(sentenceIndex: Int, text: String, meaning: String, explanation: String) = ContextPhrase(\n        words = text.lowercase().split(" "),\n        meaning = meaning,\n        explanation = explanation,\n        weakLink = true,\n        sentenceIndex = sentenceIndex\n    )\n\n'''
              if helper_anchor not in s:
                  raise SystemExit('FocusedLessons helper anchor not found')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/data/ContextLessonEnhancer.kt app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt
          git commit -m "Fix sprechen group and link first noun phrase"
          git push
