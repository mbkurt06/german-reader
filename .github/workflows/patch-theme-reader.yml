name: One-time theme reader patch

on:
  push:
    paths:
      - '.github/workflows/patch-theme-reader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch theme and reader
        run: python3 scripts/patch_theme_reader.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Unify app theme and reader override"
            git push
          fi
