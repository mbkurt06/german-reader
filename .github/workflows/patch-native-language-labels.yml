name: One-time native language labels

on:
  push:
    paths:
      - '.github/workflows/patch-native-language-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch language labels
        run: python3 scripts/patch_native_language_labels.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Show native language names with flags"
            git push
          fi
