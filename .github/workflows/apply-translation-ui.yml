name: Fix Focused Lessons

on:
  push:
    paths:
      - '.github/workflows/apply-translation-ui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Kotlin initialization order
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt')
          s = p.read_text()
          uses = s.count('phrases = commonPhrases + listOf(')
          if uses != 5:
              raise SystemExit(f'Expected 5 commonPhrases uses, found {uses}')
          s = s.replace('phrases = commonPhrases + listOf(', 'phrases = commonPhrases() + listOf(')
          old = 'private val commonPhrases = listOf('
          if old not in s:
              raise SystemExit('commonPhrases declaration not found')
          s = s.replace(old, 'private fun commonPhrases() = listOf(', 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix focused lesson phrase initialization"
          git push
