name: One-time UI controls round 2

on:
  push:
    paths:
      - '.github/workflows/patch-ui-controls-round2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch UI controls
        run: python3 scripts/patch_ui_controls_round2.py
      - name: Bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          t=p.read_text().replace('versionCode = 34','versionCode = 35').replace('versionName = "0.4.1.27"','versionName = "0.4.1.28"')
          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt app/src/main/java/de/bascurt/almancaokuyucu/ProfileSetupActivity.kt app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refine reader theme and settings controls"
            git push
          fi
