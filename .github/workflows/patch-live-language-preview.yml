name: One-time live language preview

on:
  push:
    paths:
      - '.github/workflows/patch-live-language-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch live language preview
        run: python3 scripts/patch_live_language_preview.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Preview interface language before saving"
            git push
          fi
