name: Apply Reader Patch
on:
  push:
    paths:
      - .github/workflows/add-noun-phrase-links.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch_reader_controls.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt app/src/main/java/de/bascurt/almancaokuyucu/data/UserPreferencesStore.kt app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix reader controls and remaining noun phrase link"
          git push
