name: Patch Noun Phrase Highlight UI
on:
  push:
    paths:
      - .github/workflows/add-noun-phrase-links.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt"); s=p.read_text(); old="                    val linked = highlightEnabled && sameSentence && !active && selected?.contextLinkId != null &&\n                        selected.contextLinkId == token.lexeme.contextLinkId\n"; new="                    val selectedContextLinks = buildSet {\n                        selected?.contextLinkId?.let { add(it) }\n                        selected?.contextLinkIds?.let { addAll(it) }\n                    }\n                    val tokenContextLinks = buildSet {\n                        token.lexeme.contextLinkId?.let { add(it) }\n                        addAll(token.lexeme.contextLinkIds)\n                    }\n                    val linked = highlightEnabled && sameSentence && !active &&\n                        selectedContextLinks.isNotEmpty() && selectedContextLinks.any { it in tokenContextLinks }\n"; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/MainActivity.kt
          git commit -m "Support overlapping contextual highlights"
          git push
