name: Apply First Story Noun Phrase Links
on:
  push:
    paths:
      - .github/workflows/add-noun-phrase-links.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch first story
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt')
          s = p.read_text()
          anchor = '                link("im Hotel", "otelde", "im Hotel → otelde. im = in + dem; bir yerin içinde bulunmayı anlatır."),\n'
          additions = (
              '                strongAt(13, "spricht mit über", "mit jemandem über etwas sprechen", "mit jemandem über etwas sprechen → biriyle bir şey hakkında konuşmak. Bu cümlede spricht + mit + über birlikte güçlü gruptur."),\n'
              '                linkAt(13, "einer anderen Person", "başka bir kişi", "einer anderen Person → başka bir kişi. Belirsiz artikel + sıfat + isim aynı isim grubudur; seçilen koyu, diğerleri açık vurgulanır."),\n'
              '                linkAt(13, "den nächsten Schritt", "bir sonraki adım", "den nächsten Schritt → bir sonraki adım. Artikel + sıfat + isim aynı isim grubudur; seçilen koyu, diğerleri açık vurgulanır."),\n'
              '                linkAt(14, "ihren Platz", "yerini", "ihren Platz → yerini. İyelik belirleyicisi + isim aynı isim grubudur; seçilen koyu, diğeri açık vurgulanır."),\n'
              '                linkAt(14, "den Tag", "günü", "den Tag → günü. Artikel + isim aynı isim grubudur; seçilen koyu, diğeri açık vurgulanır."),\n'
          )
          if 'strongAt(13, "spricht mit über"' not in s:
              if anchor not in s:
                  raise SystemExit('tail anchor not found')
              s = s.replace(anchor, ''.join(additions) + anchor, 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix speaking group and final noun phrases"
          git push
