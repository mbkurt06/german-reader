name: Fix First Story Tail Phrase Links
on:
  push:
    paths:
      - .github/workflows/fix-first-story-tail-links.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch first story tail links
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt')
          s = p.read_text()
          anchor = '                link("im Hotel", "otelde", "im Hotel → otelde. im = in + dem; bir yerin içinde bulunmayı anlatır."),\n'
          additions = '''                strongAt(13, "spricht mit über", "mit jemandem über etwas sprechen", "mit jemandem über etwas sprechen → biriyle bir şey hakkında konuşmak. Bu cümlede: Sie spricht kurz mit einer anderen Person über den nächsten Schritt. spricht + mit + über birlikte güçlü gruptur."),
                linkAt(13, "einer anderen Person", "başka bir kişiyle", "einer anderen Person → başka bir kişi. Belirsiz artikel + sıfat + isim aynı isim grubudur; seçilen koyu, diğerleri açık vurgulanır."),
                linkAt(13, "den nächsten Schritt", "bir sonraki adım", "den nächsten Schritt → bir sonraki adım. Artikel + sıfat + isim aynı isim grubudur; seçilen koyu, diğerleri açık vurgulanır."),
                linkAt(14, "ihren Platz", "yerini", "ihren Platz → onun yerini. İyelik belirleyicisi + isim aynı isim grubudur; seçilen koyu, diğeri açık vurgulanır."),
                linkAt(14, "den Tag", "günü", "den Tag → günü. Artikel + isim aynı isim grubudur; seçilen koyu, diğeri açık vurgulanır."),
'''
          if additions.strip() not in s:
              if anchor not in s:
                  raise SystemExit('first story anchor missing')
              s = s.replace(anchor, additions + anchor, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/bascurt/almancaokuyucu/data/FocusedLessons.kt
          git commit -m "Fix speaking group and final noun phrases"
          git push
